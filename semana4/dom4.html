<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <h1>Añadir elementos a una lista</h1>
    <ul id="mi-lista"></ul>
    <script>
        // 1. Crear el elemento
        const item1 = document.createElement("li")
        // 2. Asignarle contenido
        item1.textContent = "Comprar Cafe"
        // 3. Insertarlo en la lista
        const lista = document.getElementById("mi-lista")

        // Añadir 2 elementos
        const item2 = document.createElement("li")
        const item3 = document.createElement("li")
        item2.textContent = "Comprar Torta"
        item3.textContent = "Comprar Azucar"

        // Añadir a la lista
        lista.appendChild(item1)
        lista.appendChild(item2)
        lista.appendChild(item3)
    </script>
</body>
</html>
